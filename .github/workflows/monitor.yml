name: Мониторинг новостроек Пермского края

on:
  schedule:
    - cron: "7 * * * *"   # каждый час в :07 UTC — не в начале часа, где очередь GitHub
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perm-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Yekaterinburg   # Пермь — UTC+5; журнал пишется в местном времени
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверка
        run: python3 monitor_perm.py

      - name: Сохранить состояние
        run: |
          git config user.name "perm-monitor"
          git config user.email "perm-monitor@users.noreply.github.com"
          git add seen_ids.json found_objects.txt
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git commit -m "мониторинг: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Пульс (раз в сутки)
        run: |
          last=$(date -u -d "$(cat heartbeat.txt 2>/dev/null || echo 1970-01-01T00:00:00Z)" +%s 2>/dev/null || echo 0)
          now=$(date -u +%s)
          if [ $((now - last)) -gt 79200 ]; then
            date -u '+%Y-%m-%dT%H:%M:%SZ' > heartbeat.txt
            git add heartbeat.txt
            git commit -m "пульс"
            git push
          fi
