name: check

on:
  schedule:
    - cron: "*/5 * * * *"   # быстрая проверка: только самые свежие записи
    - cron: "12 3 * * *"    # раз в сутки: полный проход по API
  workflow_dispatch:
    inputs:
      test:
        description: "прислать тестовую карточку последней новостройки"
        type: boolean
        default: false
      greeting:
        description: "прислать приветствие, как на /start"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: perm-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Yekaterinburg
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверка
        run: |
          case "${{ github.event.schedule }}" in
            "12 3 * * *"|"") python3 monitor_perm.py ;;
            *)               python3 monitor_perm.py --quick ;;
          esac

      - name: Тестовая карточка
        if: ${{ inputs.test }}
        run: python3 monitor_perm.py --test-send

      - name: Приветствие
        if: ${{ inputs.greeting }}
        run: python3 monitor_perm.py --test-greeting

      - name: Сохранить состояние
        if: always()
        run: |
          git config user.name "perm-monitor"
          git config user.email "perm-monitor@users.noreply.github.com"
          git add seen_ids.json seen_groups.json found_objects.txt tg_state.json
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git commit -m "state: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Пульс (раз в сутки)
        run: |
          last=$(date -u -d "$(cat heartbeat.txt 2>/dev/null || echo 1970-01-01T00:00:00Z)" +%s 2>/dev/null || echo 0)
          now=$(date -u +%s)
          if [ $((now - last)) -gt 79200 ]; then
            date -u '+%Y-%m-%dT%H:%M:%SZ' > heartbeat.txt
            git add heartbeat.txt
            git commit -m "пульс"
            git push
          fi
